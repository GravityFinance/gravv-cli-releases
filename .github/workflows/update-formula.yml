name: Update Homebrew Formula

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the current release)"
        required: false
        type: string
  # Lets the gravv-cli release workflow publish the formula the moment a
  # release finishes, instead of waiting up to four hours for the schedule.
  repository_dispatch:
    types: [gravv-released]

permissions:
  contents: write

jobs:
  update-formula:
    name: Regenerate formula from published checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The formula is regenerated unconditionally rather than only when the
      # version changes. A version-gated update cannot repair a formula whose
      # version is already current but whose hashes are wrong, which is how
      # three of the four hashes stayed broken through several releases.
      - name: Regenerate formula
        run: ./scripts/update-formula.sh "${{ inputs.version || github.event.client_payload.version || '' }}"

      - name: Commit if the formula changed
        run: |
          if git diff --quiet -- Formula/gravv.rb; then
            echo "Formula already matches the published checksums; nothing to do."
            exit 0
          fi
          version=$(grep -m1 'version "' Formula/gravv.rb | sed 's/.*version "\(.*\)"/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gravv.rb
          git commit -m "chore: regenerate formula for v${version}"
          git push
